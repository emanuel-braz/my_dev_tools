<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram</title>
  <style>
    #modalContent h1, #modalContent h2, #modalContent h3 {
      margin-top: 1em;
      margin-bottom: 0.5em;
      font-weight: bold;
    }
  
    #modalContent h1 {
      font-size: 2em;
    }
  
    #modalContent h2 {
      font-size: 1.5em;
    }
  
    #modalContent h3 {
      font-size: 1.2em;
    }
  
    #modalContent p {
      margin: 0.5em 0;
    }
  
    #modalContent ul, #modalContent ol {
      margin: 0.5em 0;
      padding-left: 1.5em;
    }
  
    #modalContent code {
      background-color: #2d2d2d;
      padding: 0.2em 0.4em;
      border-radius: 3px;
      font-family: monospace;
    }
  
    #modalContent pre {
      background-color: #2d2d2d;
      padding: 1em;
      border-radius: 4px;
      overflow-x: auto;
    }
  
    #modalContent pre code {
      background-color: transparent;
      padding: 0;
    }

    /* Analysis styling */

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #1e1e1e; /* Match VS Code's dark theme */
      color: #d4d4d4; /* Default text color */
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    .mermaid {
      transition: transform 0.2s ease;
      transform-origin: top left;
      width: 100%;
      cursor: grab;
      background-color: transparent; /* Transparent background for diagram */
      overflow: hidden; /* Prevent scrolling */
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .mermaid:active {
      cursor: grabbing;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #252526; /* VS Code panel background */
      padding: 20px;
      border-radius: 4px;
      width: 80%;
      max-width: 800px;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 10px;
      cursor: pointer;
      color: #d4d4d4;
      font-size: 24px;
    }

    .close:hover {
      color: #fff;
    }

    /* Toolbar Styles */
    .toolbar {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 100;
      display: flex;
      gap: 8px;
    }

    .toolbar button {
      background-color: #3c3c3c; /* VS Code button background */
      border: 1px solid #666;
      color: #d4d4d4;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .toolbar button:hover {
      background-color: #4a4a4a; /* Slightly lighter on hover */
    }

    /* Code Display Styles */
    pre {
      background-color: #1e1e1e;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>

    function openModal() {
      const mermaidElement = document.querySelector('.mermaid');
      const mermaidCode = mermaidElement.getAttribute('data-mermaid-code');
      const modal = document.getElementById('modal');
      const modalContent = document.getElementById('modalContent');
      modalContent.innerHTML = `<pre>${mermaidCode}</pre>`;
      modal.style.display = 'flex';
    }

    function openModalAnalysis() {
      const analysisElement = document.getElementById('analysis');
      const analysisContent = analysisElement.textContent;
      const renderedAnalysis = marked.parse(analysisContent);
      const modal = document.getElementById('modal');
      const modalContent = document.getElementById('modalContent');
      modalContent.innerHTML = renderedAnalysis;
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    window.onclick = function (event) {
      const modal = document.getElementById('modal');
      if (event.target === modal) {
        closeModal();
      }
    };
  </script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.3.0/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ 
      startOnLoad: true,
      theme: 'dark',
      themeVariables: {
        primaryColor: '#6366f1',         // Indigo as primary color
        primaryTextColor: '#ffffff',     // White text on primary
        primaryBorderColor: '#818cf8',   // Lighter indigo for borders
        lineColor: '#9ca3af',            // Gray for lines
        secondaryColor: '#4f46e5',       // Darker indigo as secondary
        tertiaryColor: '#1e1e1e',        // Match background color for fills
        
        // Node colors
        nodeBorder: '#6366f1',           // Indigo border for nodes
        mainBkg: '#2d2d2d',              // Slightly lighter than bg for nodes
        nodeBkg: '#2d2d2d',
        
        // Text colors
        textColor: '#d4d4d4',            // Light gray for text (same as body)
        
        // Contrast colors for different node types
        classText: '#ffffff',
        fillType0: '#6366f1',            // Indigo
        fillType1: '#8b5cf6',            // Purple
        fillType2: '#ec4899',            // Pink
        fillType3: '#f43f5e',            // Rose
        fillType4: '#f97316',            // Orange
        fillType5: '#10b981',            // Emerald
        fillType6: '#06b6d4',            // Cyan
        fillType7: '#3b82f6',            // Blue
        
        // Contrast text colors
        noteTextColor: '#1e1e1e',
        
        // Relationship colors
        edgeLabelBackground: '#2d2d2d',
        
        // Font sizes
        fontSize: '16px',
        fontFamily: 'Arial, sans-serif',
      }
    });

    let scale = 1;
    let isPanning = false;
    let startX, startY, translateX = 0, translateY = 0;

    document.addEventListener("DOMContentLoaded", function () {
      const mermaidElement = document.querySelector('.mermaid');
      const container = document.createElement('div');
      container.className = 'diagram-container';
      container.style.width = '100%';
      container.style.height = '100vh';
      container.style.overflow = 'hidden';
      container.style.position = 'relative';
      container.style.zIndex = '1';
      
      // Wrap the mermaid element in our container
      mermaidElement.parentNode.insertBefore(container, mermaidElement);
      container.appendChild(mermaidElement);
      
      // Style the mermaid element for better zooming/panning
      mermaidElement.style.position = 'absolute';
      mermaidElement.style.transformOrigin = '0 0';
      mermaidElement.style.zIndex = '2';
      mermaidElement.style.minWidth = '100%';
      mermaidElement.style.minHeight = '100%';
      
      // Add controls for zoom
      const zoomControls = document.createElement('div');
      zoomControls.className = 'zoom-controls';
      zoomControls.style.position = 'fixed';
      zoomControls.style.left = '10px';
      zoomControls.style.top = '10px';
      zoomControls.style.zIndex = '100';
      zoomControls.style.display = 'flex';
      zoomControls.style.gap = '8px';
      
      const zoomInBtn = document.createElement('button');
      zoomInBtn.textContent = '+ Zoom In';
      zoomInBtn.style.backgroundColor = '#3c3c3c';
      zoomInBtn.style.border = '1px solid #666';
      zoomInBtn.style.color = '#d4d4d4';
      zoomInBtn.style.padding = '8px 12px';
      zoomInBtn.style.borderRadius = '4px';
      zoomInBtn.style.cursor = 'pointer';
      
      const zoomOutBtn = document.createElement('button');
      zoomOutBtn.textContent = '- Zoom Out';
      zoomOutBtn.style.backgroundColor = '#3c3c3c';
      zoomOutBtn.style.border = '1px solid #666';
      zoomOutBtn.style.color = '#d4d4d4';
      zoomOutBtn.style.padding = '8px 12px';
      zoomOutBtn.style.borderRadius = '4px';
      zoomOutBtn.style.cursor = 'pointer';
      
      const resetBtn = document.createElement('button');
      resetBtn.textContent = 'Reset View';
      resetBtn.style.backgroundColor = '#3c3c3c';
      resetBtn.style.border = '1px solid #666';
      resetBtn.style.color = '#d4d4d4';
      resetBtn.style.padding = '8px 12px';
      resetBtn.style.borderRadius = '4px';
      resetBtn.style.cursor = 'pointer';
      
      zoomControls.appendChild(zoomInBtn);
      zoomControls.appendChild(zoomOutBtn);
      zoomControls.appendChild(resetBtn);
      document.body.appendChild(zoomControls);
      
      // Zoom functionality
      zoomInBtn.addEventListener('click', function() {
        scale += 0.1;
        updateTransform();
      });
      
      zoomOutBtn.addEventListener('click', function() {
        scale = Math.max(0.1, scale - 0.1);
        updateTransform();
      });
      
      resetBtn.addEventListener('click', function() {
        scale = 1;
        translateX = 0;
        translateY = 0;
        updateTransform();
      });
      
      // Apply transform
      function updateTransform() {
        mermaidElement.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      }
      
      // Pan (drag) functionality for entire diagram
      if (mermaidElement) {
        mermaidElement.addEventListener('mousedown', function (event) {
          isPanning = true;
          startX = event.clientX - translateX;
          startY = event.clientY - translateY;
          mermaidElement.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', function (event) {
          if (isPanning) {
            translateX = event.clientX - startX;
            translateY = event.clientY - startY;
            updateTransform();
          }
        });

        document.addEventListener('mouseup', function () {
          isPanning = false;
          mermaidElement.style.cursor = 'grab';
        });
        
        // Add wheel zoom functionality
        container.addEventListener('wheel', function(event) {
          event.preventDefault();
          const delta = event.deltaY || event.detail || event.wheelDelta;
          
          // Calculate where in the element the mouse is hovering
          const rect = container.getBoundingClientRect();
          const mouseX = event.clientX - rect.left;
          const mouseY = event.clientY - rect.top;
          
          // Calculate where in the transformed element the mouse is hovering
          const elementX = (mouseX - translateX) / scale;
          const elementY = (mouseY - translateY) / scale;
          
          // Calculate new scale
          const newScale = delta > 0 ? Math.max(0.1, scale - 0.1) : scale + 0.1;
          
          // Calculate new translate values
          translateX = mouseX - elementX * newScale;
          translateY = mouseY - elementY * newScale;
          
          scale = newScale;
          updateTransform();
        });
      }

      // Add style to body to prevent overflow
      document.body.style.overflow = 'hidden';
    });
  </script>
</head>
<body>
  <div class="toolbar">
    <button onclick="openModal()">Show Mermaid Code</button>
    <button onclick="openModalAnalysis()">Show Textual Analysis</button>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <div id="modalContent"></div>
    </div>
  </div>

  <div class="mermaid" data-mermaid-code="${diagram}">
    ${diagram}
  </div>

  <div id="analysis" style="display: none;">${analysis}</div>
</body>
</html>
